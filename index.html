:root{

html,body{margin:0;min-height:100%}
body{font-family:Rubik,system-ui,sans-serif;color:var(--txt);background:var(--bg);

#sheet{position:fixed;inset:0;z-index:30;display:none}

#sheet .pn{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#1d1842;border-radius:24px 24px 0 0;padding:18px 18px calc(var(--sb) + 18px);max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
#sheet h2{margin:0 0 14px;font-size:19px}
#sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%) translateY(20px);background:#2b2460;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.spark{position:fixed;pointer-events:none;z-index:50;font-size:18px;animation:spk 1.1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.breathe .chip{padding:10px 16px;font-size:16px;border-color:rgba(246,200,105,.45);animation:breathe 3.6s ease-in-out infinite}
.breathe .chip:nth-child(2){animation-delay:1.8s}

.ring.sm{width:84px;height:84px}
.chip.tap{cursor:pointer}
.chip .tm{color:var(--gold2);font-size:13px}
.wakebox{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.wakebox input{width:auto;flex:1;text-align:center;font-size:18px;direction:ltr}
.rolerow{cursor:pointer}
.rolerow .cnt{color:var(--mut);font-size:13px}
.slot{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);margin-bottom:10px}

.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}

.qitem{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:8px;font-size:14px;display:flex;gap:8px}
.qitem div{flex:1;white-space:pre-wrap}
</style>

function sparkle(el){
  const r = el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for (let i=0;i<14;i++){ const s=document.createElement("span"); s.className="spark"; s.textContent=["✨","⭐","💛","✦"][i%4];
    const a=Math.random()*Math.PI*2, d=60+Math.random()*80; s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.setProperty("--dx",Math.cos(a)*d+"px"); s.style.setProperty("--dy",Math.sin(a)*d+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200); }
}

/* ========= שכבת נתונים: משותפת (db) או מקומית ========= */
let DB=null, UID=null, LOCAL=false, READONLY=false, FB=null, FS=null;
const local = {
  data: (()=>{ try { return JSON.parse(lsGet("asiria-local")||"{}"); } catch { return {}; } })(),
  ls: [],
  save(){ lsSet("asiria-local", JSON.stringify(this.data)); },
  emit(path){ this.ls.forEach(l => { if (path.startsWith(l.p)) l.fn(); }); },
  watch(p, fn){ const l={p,fn}; this.ls.push(l); setTimeout(fn,0); return ()=>{ this.ls=this.ls.filter(x=>x!==l); }; },
  list(col){ return Object.entries(this.data).filter(([k])=>k.slice(0,k.lastIndexOf("/"))===col).map(([k,v])=>({id:k.slice(k.lastIndexOf("/")+1),...v})); },
};
const cmp = (a,op,b) => op==="=="?a===b: op===">="?a>=b: op==="<="?a<=b: op===">"?a>b: op==="<"?a<b: true;
function onDbErr(e){ console.warn("db", e); if (e && e.code==="revoked") { READONLY=true; render(); } }
function fbErr(e){ console.warn("fb", e); if (e && e.code==="permission-denied"){ toast("אין הרשאה – בדוק את כללי האבטחה ב-Firebase"); } }
function watchDoc(path, cb){
  if (FB) return FB.onSnapshot(FB.doc(FS,path), s=>{ gotData(); cb(s.exists() ? s.data() : null); }, fbErr);
  if (LOCAL) return local.watch(path, ()=>cb(local.data[path]||null));
  return DB.doc(path).onSnapshot(s=>{ gotData(); cb(s.exists ? s.data() : null); }, onDbErr);
}
function watchCol(path, wheres, cb){
  if (FB) return FB.onSnapshot(FB.query(FB.collection(FS,path), ...wheres.map(w=>FB.where(...w))), s=>{ gotData(); cb(s.docs.map(d=>({id:d.id, ...d.data()}))); }, fbErr);
  if (LOCAL) return local.watch(path, ()=>cb(local.list(path).filter(d=>wheres.every(([f,op,v])=>cmp(d[f],op,v)))));
  let q = DB.collection(path); wheres.forEach(w => q = q.where(...w));
  return q.onSnapshot(s=>{ gotData(); cb(s.docs.map(d=>({id:d.id, ...d.data()}))); }, onDbErr);
}
const chains = {};
function put(path, data){
  if (READONLY) { toast("אין הרשאת עריכה"); return Promise.resolve(); }
  const run = async () => {
    if (LOCAL) { local.data[path]=data; local.save(); local.emit(path); return; }
    if (FB) { try { await FB.setDoc(FB.doc(FS,path), data); } catch(e){ fbErr(e); if(!e||e.code!=="permission-denied") toast("השמירה נכשלה, נסה שוב"); } return; }
    try { await DB.doc(path).set(data); }
    catch(e){ if (e && e.code==="invalid_argument"){ READONLY=true; toast("אין לך הרשאה לשמור – בקש מהמנהל הרשאת עריכה"); render(); }
              else if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await DB.doc(path).set(data);}catch{ toast("השמירה נכשלה, נסה שוב"); } }
              else toast("השמירה נכשלה"); }
  };
  return chains[path] = (chains[path]||Promise.resolve()).then(run);
}
function remove(path){
  const run = async () => { if (FB){ try { await FB.deleteDoc(FB.doc(FS,path)); } catch(e){ fbErr(e); toast("המחיקה נכשלה"); } return; } if (LOCAL){ delete local.data[path]; local.save(); local.emit(path); return; } try { await DB.doc(path).delete(); } catch { toast("המחיקה נכשלה"); } };
  return chains[path] = (chains[path]||Promise.resolve()).then(run);
}

/* ========= אתחול ========= */
async function init(){
  renderNav(); render(); $("#hlogo").innerHTML = SUN;
  let c = null;
  if (FIREBASE_CONFIG){
    try {
      const V="10.12.2", base=`https://www.gstatic.com/firebasejs/${V}/`;
      const [A, Au, F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
      const app = A.initializeApp(FIREBASE_CONFIG);
      let fs; try { fs = F.initializeFirestore(app, {ignoreUndefinedProperties:true, localCache: F.persistentLocalCache()}); } catch { fs = F.getFirestore(app); }
      const auth = Au.getAuth(app);
      const user = await new Promise((res, rej) => { const off = Au.onAuthStateChanged(auth, u => { if (u){ off(); res(u); } }); Au.signInAnonymously(auth).catch(rej); });
      FB=F; FS=fs; UID=user.uid; c=true;
    } catch(e){ console.warn("firebase init", e); toast("לא הצלחנו להתחבר לשרת – בודק שוב..."); }
  }
  for (let i=0;i<30 && !c && !(window.claude && typeof window.claude.use==="function");i++) await new Promise(r=>setTimeout(r,100));
  if (!c && window.claude && typeof window.claude.use==="function"){
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (db && user){ const id = await user.id(); if (id){ DB=db; UID=id; c=true;
        try { const w = await user.can("data.write"); if (w===false) READONLY=true; } catch {} } }
    } catch(e){ console.warn(e); }
  }
  if (!c){ LOCAL=true; UID = lsGet("asiria-uid") || ("u"+Math.random().toString(36).slice(2,10)); lsSet("asiria-uid", UID); }
  if (!LOCAL && !FB) loadTimer = setTimeout(()=>{ stale=true; render(); }, 10000);
  watchCol("members", [], d => { S.members=d; S.ready=true; checkOnboarding(); render(); });
  watchDoc("config/main", d => { S.config=d||{}; render(); });
  watchDoc("days/"+T(), d => { S.today=d||{}; render(); });
  watchDoc("days/"+TM(), d => { S.tomorrow=d||{}; render(); });
  watchCol("checkins", [["date",">=",dkey(addDays(-13))]], d => { S.checkins=d; render(); });
  watchCol("wakereq", [["date",">=",T()]], d => { S.wakereq=d; render(); });
  watchCol("shifts", [["date",">=",T()]], d => { S.shifts=d; render(); });
  watchCol("quotes", [], d => { S.quotes=d; if (!splashShown) showSplash(); });
  setTimeout(()=>{ if(!splashShown) showSplash(); }, 2500);
  setInterval(()=>{ if (S.tab==="home" && !$("#sheet").classList.contains("open")) render(); }, 30000);
}

/* ========= רכיבים ========= */
function ring(val, max, color, label, sz=92){
  const R=sz/2-8, c=sz/2, C=2*Math.PI*R, p = max ? Math.min(val/max,1) : 0;
  return `<div class="stat"><div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle class="bgc" cx="${c}" cy="${c}" r="${R}"/>
    <circle class="fg" cx="${c}" cy="${c}" r="${R}" stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>
    <div class="v"><span dir="ltr">${val}${max?`<small style="font-size:13px;color:var(--mut)">/${max}</small>`:""}</span></div></div>${label}</div>`;
}
function pairHtml(arr, cls=""){
  const a = (arr||[]).filter(Boolean);
  if (!a.length) return `<span class="empty">עוד לא נקבע</span>`;
  return `<div class="pair ${cls}">${a.map(n=>`<span class="chip ${n===myName()?"me":""}">${avatar(n)}${esc(n)}</span>`).join("")}</div>`;
}
function eventsFor(d){
  const day=d.getDay();
  return SCHEDULE.filter(e=>e.days.includes(day)).map(e=>({...e})).sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function zoomFor(kind){
  if (kind==="daily") return S.today.zoom || cfg("zoomDaily");
  if (kind==="friday") return cfg("zoomFriday") || cfg("zoomDaily");
  if (kind==="community") return cfg("zoomCommunity");
  if (kind==="lesson") return cfg("lessonLink");
  return "";
}
function nextEvent(){
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  for (let k=0;k<7;k++){
    const d=addDays(k); const evs=eventsFor(d);
    for (const e of evs){ const s=toMin(e.start), en=toMin(e.end);
      if (k>0 || en>nm) return {...e, live: k===0 && s<=nm && nm<en, inMin: k===0 ? s-nm : (k*1440 + s - nm), dayOffset:k, date:d}; }
  }
  return null;
}
function fmtIn(m){ if (m<60) return `בעוד ${m} דק׳`; const h=Math.floor(m/60), r=m%60; if (h<24) return `בעוד ${h}:${pad(r)} שע׳`; return ""; }

  </div>
  <div class="card"><h3>⏰ בקשות השכמה למחר</h3>
    ${req.length?`<div class="pair" style="margin-bottom:6px">${req.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||"")).map(r=>`<span class="chip tap" data-wakeid="${esc(r.id)}">${avatar(r.name)}${esc(r.name)}${S.openWake===r.id?` <span class="tm">· ${r.time?`<span dir="ltr">${esc(r.time)}</span>`:"בלי שעה"}</span>`:""}</span>`).join("")}</div>
      <div class="note" style="text-align:start;margin-top:0">לחיצה על שם מראה באיזו שעה להעיר</div>`:`<div class="empty" style="margin-bottom:12px">אין בקשות השכמה למחר</div>`}
    ${myReq?`<button class="btn on" data-act="wake">✓ ביקשתי השכמה ב־<span dir="ltr">${esc(myReq.time||"")}</span> · ביטול</button>`
      :`<div class="wakebox"><span style="color:var(--mut);font-size:14px">באיזו שעה?</span><select id="wt" style="width:auto;flex:1;text-align:center;font-size:18px;direction:ltr">${wakeOpts(lsGet("asiria-waketime")||"02:30")}</select></div>
        <button class="btn gold" data-act="wake">תעירו אותי מחר 🙏</button>`}
  </div>
  <div class="card"><h3>📈 העשירייה בשיעור בוקר – שבועיים אחרונים</h3>
    <svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf9e"/><stop offset="1" stop-color="#f0a85a"/></linearGradient></defs>${bars}</svg>
  </div>`;
}

function taskView(){
  const t = S.today.task; const done = S.checkins.filter(c=>c.date===T()&&c.task);
  const me = myCheck();
  return `<div class="card"><h3>✅ המשימה היומית <button class="edit" data-act="task">${t?"עריכה":"הוספה"}</button></h3>
    ${t?`<div class="task">${esc(t.text)}</div>${t.by?`<div class="task-by">הועלתה ע״י ${esc(t.by)}</div>`:""}`
       :`<div class="empty">התורנים עוד לא העלו משימה להיום.</div>`}
  </div>
  ${t?`<button class="btn ${me.task?"on":"gold"}" data-act="taskdone" style="margin-bottom:14px">${me.task?"✓ ביצעתי את המשימה":"ביצעתי את המשימה 💪"}</button>`:""}
  <div class="card"><div class="stats">${ring(done.length,S.members.length,"var(--mint)","חברים השלימו")}</div>
    ${done.length?`<div class="pair" style="margin-top:14px;justify-content:center">${done.map(c=>`<span class="chip">${avatar(c.name)}${esc(c.name)}</span>`).join("")}</div>`:""}
  </div>`;
}

function dutyView(){
  const head = cfg("head")||{}; const roles = roleList();
  return `<div class="card"><h3>👑 ראש העשירייה השבוע <button class="edit" data-act="head">עריכה</button></h3>
    ${head.name?`<div class="king"><div class="crown">👑</div><div><div class="n">${esc(head.name)}</div>${head.message?`<div class="m">${esc(head.message)}</div>`:""}</div></div>`:`<span class="empty">עוד לא נבחר</span>`}
  </div>
  <div class="card"><h3>☀️ תורנים היום <button class="edit" data-act="dutyToday">עריכה</button></h3>${pairHtml(S.today.duty,"breathe")}</div>
  <div class="card"><h3>🌙 תורנים מחר <button class="edit" data-act="dutyTomorrow">קביעה</button></h3>${pairHtml(S.tomorrow.duty)}</div>
  <div class="card"><h3>✨ תורני שישי <button class="edit" data-act="friday">עריכה</button></h3>${pairHtml(cfg("friday"))}</div>
  <div class="card"><h3>🧺 תפקידים השבוע <button class="edit" data-act="roles">+ הוספה / עריכה</button></h3>
    <div class="list">${roles.map(r=>{ const sh=S.shifts.filter(x=>x.roleId===r.id); const names=[...new Set(sh.map(x=>x.name))];
      return `<div class="li rolerow" data-role="${esc(r.id)}"><span style="flex:1">${esc(r.role)}<br><span class="cnt">${sh.length?`${new Set(sh.map(x=>x.date+x.time)).size} מועדים · ${names.length} חברים`:"אין עדיין הרשמות"}</span></span>
        <span style="display:flex">${names.slice(0,4).map(n=>`<span style="margin-inline-start:-8px">${avatar(n)}</span>`).join("")}</span><span style="color:var(--gold)">‹</span></div>`; }).join("")}</div>
    <div class="note" style="margin-bottom:0">לחיצה על תפקיד מראה מי נרשם ומתי, ואפשר להצטרף</div>
  </div>
  <div class="card"><h3>👥 חברי העשירייה (${S.members.length})</h3>
    <div class="pair">${memberNames().map(n=>`<span class="chip ${n===myName()?"me":""}">${avatar(n)}${esc(n)}</span>`).join("")||`<span class="empty">עוד אין חברים</span>`}</div>
  </div>`;
}

/* ========= פעולות ========= */
function setCheck(patch, date=T()){
  if (!myName()) return checkOnboarding();
  const id=`${date}_${safeId(UID)}`; const cur = S.checkins.find(c=>c.id===id) || {};
  const {id:_, ...body} = cur;
  const next = {...body, date, uid:safeId(UID), name:myName(), ...patch};
  // עדכון מיידי בתצוגה
  const i=S.checkins.findIndex(c=>c.id===id); const row={id,...next}; if(i>=0) S.checkins[i]=row; else S.checkins.push(row);
  render(); return put("checkins/"+id, next);
}
function saveConfig(patch){ S.config={...S.config,...patch}; render(); return put("config/main", S.config); }
function saveDay(which, patch){
  const key = which==="today"?T():TM(); const cur = which==="today"?S.today:S.tomorrow;
  const next={...cur,...patch}; if(which==="today") S.today=next; else S.tomorrow=next; render();
  return put("days/"+key, next);
}

function bind(){
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{
    const a=b.dataset.act; const me=myCheck();
    if (a==="woke"){ const on=!me.woke; if(on) sparkle(b); setTimeout(()=>{ setCheck({woke:on, wokeAt:on?Date.now():null}); if(on) toast("בוקר אור! 🦁"); },0); }
    else if (a==="watched"){ const on=!me.watched; setCheck({watched:on, watchedAt:on?Date.now():null}); if(on) sparkle(b); }
    else if (a==="taskdone"){ const on=!me.task; setCheck({task:on}); if(on){ confetti(); toast("כל הכבוד! 🎉"); } }
    else if (a==="wake"){ const id=`${TM()}_${safeId(UID)}`; if (!myName()) return checkOnboarding();
      if (S.wakereq.some(r=>r.id===id)){ S.wakereq=S.wakereq.filter(r=>r.id!==id); render(); remove("wakereq/"+id); }
      else { const tm=($("#wt")?.value||"").trim(); if(!tm){ toast("בחר שעה להשכמה"); return; } lsSet("asiria-waketime",tm);
        S.wakereq.push({id,date:TM(),name:myName(),time:tm}); render(); put("wakereq/"+id,{date:TM(),uid:safeId(UID),name:myName(),time:tm}); toast(`החברים יעירו אותך ב־${tm} 🙏`); } }
    else if (a==="task") editTask();
    else if (a==="head") editHead();
    else if (a==="dutyToday") editPair("התורנים של היום", S.today.duty, v=>saveDay("today",{duty:v}));
    else if (a==="dutyTomorrow") editPair("התורנים של מחר", S.tomorrow.duty, v=>saveDay("tomorrow",{duty:v}));
    else if (a==="friday") editPair("תורני שישי", cfg("friday"), v=>saveConfig({friday:v}));
    else if (a==="roles") editRoles();
    else if (a==="links") editLinks();
    else if (a==="zoom") openSettings();
  });
  document.querySelectorAll("[data-wakeid]").forEach(c=>c.onclick=()=>{ S.openWake = S.openWake===c.dataset.wakeid ? null : c.dataset.wakeid; render(); });
  document.querySelectorAll("[data-role]").forEach(c=>c.onclick=()=>openRole(c.dataset.role));
}

/* ========= חלוניות עריכה ========= */
function openSheet(title, body, onSave, saveLabel="שמירה"){
  const sh=$("#sheet"); sh.classList.add("open");
  sh.querySelector(".pn").innerHTML = `<h2>${title}</h2>${body}<div style="height:18px"></div><div class="row"><button class="btn ghost" id="sx">ביטול</button>${onSave?`<button class="btn gold" id="ss">${saveLabel}</button>`:""}</div>`;
  const close=()=>{ sh.classList.remove("open"); openRoleId=null; };
  sh.querySelector(".bd").onclick=close; $("#sx").onclick=close;
  if (onSave) $("#ss").onclick=()=>{ if(onSave()!==false) close(); };
}
const dl = () => `<datalist id="mem">${memberNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
function editPair(title, cur, save){
  const [a,b] = cur||[];
  openSheet(title, `${dl()}<label>חבר ראשון</label><input id="p1" list="mem" value="${esc(a||"")}"><label>חבר שני</label><input id="p2" list="mem" value="${esc(b||"")}">`,
    ()=>{ save([$("#p1").value.trim(),$("#p2").value.trim()].filter(Boolean)); toast("נשמר ✓"); });
}
function editHead(){
  const h=cfg("head")||{};
  openSheet("👑 ראש העשירייה השבוע", `${dl()}<label>מי ראש העשירייה?</label><input id="hn" list="mem" value="${esc(h.name||"")}">
    <label>המסר / הכוונה לשבוע</label><textarea id="hm" placeholder="מה הרוח שאנחנו מביאים השבוע?">${esc(h.message||"")}</textarea>`,
    ()=>{ saveConfig({head:{name:$("#hn").value.trim(), message:$("#hm").value.trim(), since:T()}}); toast("נשמר ✓"); });
}
function editTask(){
  const t=S.today.task||{};
  openSheet("✅ המשימה היומית", `<label>מה המשימה של היום?</label><textarea id="tt" placeholder="לדוגמה: לשלוח לחבר מילה טובה לפני מפגש הערב">${esc(t.text||"")}</textarea>`,
    ()=>{ const v=$("#tt").value.trim(); saveDay("today",{task: v?{text:v, by:myName()}:null}); toast("המשימה פורסמה ✓"); });
}
function editRoles(){
  const roles = roleList();
  openSheet("🧺 רשימת התפקידים", `<div class="note" style="text-align:start">כאן משנים את שמות התפקידים. ההרשמה עצמה נעשית בלחיצה על תפקיד.</div><div id="rl">${roles.map(r=>`<input class="rr" data-id="${esc(r.id)}" value="${esc(r.role)}" placeholder="שם התפקיד" style="margin-bottom:8px">`).join("")}</div>
    <button class="btn ghost" id="addr">+ תפקיד נוסף</button>`, ()=>{
      const rr=[...document.querySelectorAll(".rr")];
      saveConfig({roles: rr.map(x=>({id: x.dataset.id || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)), role:x.value.trim()})).filter(r=>r.role)}); toast("נשמר ✓"); });
  $("#addr").onclick=()=>{ $("#rl").insertAdjacentHTML("beforeend",`<input class="rr" placeholder="שם התפקיד" style="margin-bottom:8px">`); };
}
let openRoleId=null, editShift=null, delArm=false;
function openRole(id, keep){
  if (!keep || openRoleId!==id){ editShift=null; delArm=false; }
  const r = roleList().find(x=>x.id===id); if (!r) return;
  openRoleId = id;
  const sh = S.shifts.filter(x=>x.roleId===id);
  const slots = {}; sh.forEach(x=>{ const k=x.date+"|"+(x.time||""); (slots[k]=slots[k]||[]).push(x); });
  const keys = Object.keys(slots).sort();
  const me = myName();
  const es = editShift && S.shifts.find(x=>x.id===editShift);
  openSheet(`🧺 ${esc(r.role)}`, `${dl()}
    <div class="row" style="margin-bottom:14px"><input id="rname" value="${esc(r.role)}" aria-label="שם התפקיד"><button class="btn" id="rsave" style="flex:0 0 auto;width:auto;padding:12px 16px">✏️ שמירה</button></div>
    ${keys.length?keys.map(k=>{ const [date,time]=k.split("|"); const ppl=slots[k]; const inIt=ppl.some(p=>p.name===me);
      return `<div class="slot"><div class="when">${fmtDate(date)}${time?` · <span dir="ltr">${esc(time)}</span>`:""}</div>
        <div class="pair">${ppl.map(p=>`<span class="chip tap ${p.name===me?"me":""} ${p.id===editShift?"me":""}" data-editshift="${esc(p.id)}">${avatar(p.name)}${esc(p.name)}<button data-delshift="${esc(p.id)}" aria-label="הסרה">✕</button></span>`).join("")}</div>
        ${inIt?"":`<div style="height:10px"></div><button class="btn" data-join="${esc(k)}">גם אני מצטרף 🤝</button>`}</div>`; }).join("")
      :`<div class="empty" style="margin-bottom:12px">עוד אף אחד לא נרשם לתפקיד הזה</div>`}
    ${keys.length?`<div class="note" style="text-align:start;margin:0">לחיצה על שם מאפשרת לשנות לו תאריך או שעה</div>`:""}
    <div class="card" style="margin:14px 0 0;animation:none"><h3>${es?"עריכת הרשמה":"הרשמה למועד חדש"}</h3>
      <label style="margin-top:0">מי?</label><input id="sn2" list="mem" value="${esc(es?es.name:me)}">
      <div class="row"><div><label>תאריך</label><input type="date" id="sd" value="${esc(es?es.date:T())}" min="${T()}" style="direction:ltr"></div>
      <div><label>שעה</label><input type="time" id="st" value="${esc(es?es.time||"":"")}" style="direction:ltr"></div></div>
      <div style="height:12px"></div><button class="btn gold" id="sadd">${es?"עדכון":"הרשמה"}</button>
      ${es?`<div style="height:8px"></div><button class="btn ghost" id="scancel">ביטול עריכה</button>`:""}</div>
    <div style="height:12px"></div><button class="btn ghost" id="rdel" style="color:var(--rose)">${delArm?"לחץ שוב כדי למחוק את התפקיד וכל ההרשמות":"🗑️ מחיקת התפקיד"}</button>`, null);
  $("#rsave").onclick=()=>{ const v=$("#rname").value.trim(); if(!v) return toast("צריך שם לתפקיד");
    saveConfig({roles: roleList().map(x=>x.id===id?{id,role:v}:x)}); toast("שם התפקיד עודכן ✓"); openRole(id,true); };
  $("#rdel").onclick=()=>{ if(!delArm){ delArm=true; return openRole(id,true); }
    const mine=S.shifts.filter(x=>x.roleId===id); S.shifts=S.shifts.filter(x=>x.roleId!==id); mine.forEach(x=>remove("shifts/"+x.id));
    saveConfig({roles: roleList().filter(x=>x.id!==id)}); $("#sheet").classList.remove("open"); openRoleId=null; toast("התפקיד נמחק"); };
  if ($("#scancel")) $("#scancel").onclick=()=>{ editShift=null; openRole(id,true); };
  document.querySelectorAll("[data-editshift]").forEach(c=>c.onclick=e=>{ if(e.target.closest("[data-delshift]")) return; editShift=c.dataset.editshift; openRole(id,true); setTimeout(()=>$("#sn2")?.scrollIntoView({behavior:"smooth",block:"center"}),50); });
  const addShift = (name, date, time) => {
    const sid="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const doc={roleId:id, role:r.role, name, date, time, at:Date.now(), by:me};
    S.shifts.push({id:sid,...doc}); put("shifts/"+sid, doc); render(); openRole(id,true); toast("נרשמת ✓");
  };
  $("#sadd").onclick=()=>{ const n=$("#sn2").value.trim(), d=$("#sd").value, t=$("#st").value;
    if(!n) return toast("מי נרשם?"); if(!d) return toast("בחר תאריך"); if(!t) return toast("בחר שעה");
    if (es){ const doc={...es, name:n, date:d, time:t, at:Date.now()}; delete doc.id; const i=S.shifts.findIndex(x=>x.id===es.id); S.shifts[i]={id:es.id,...doc};
      put("shifts/"+es.id, doc); editShift=null; render(); openRole(id,true); toast("ההרשמה עודכנה ✓"); return; }
    addShift(n,d,t); };
  document.querySelectorAll("[data-join]").forEach(b=>b.onclick=()=>{ if(!me) return checkOnboarding(); const [d,t]=b.dataset.join.split("|"); addShift(me,d,t); });
  document.querySelectorAll("[data-delshift]").forEach(b=>b.onclick=()=>{ const sid=b.dataset.delshift; S.shifts=S.shifts.filter(x=>x.id!==sid); if(editShift===sid) editShift=null; remove("shifts/"+sid); render(); openRole(id,true); });
}
function editLinks(){
  const links=cfg("links")||[];
  openSheet("🔗 קישורים שימושיים", `<label>כל שורה: שם | קישור</label><textarea id="lk" style="min-height:150px" placeholder="חומרי לימוד | https://...&#10;מערכת תשלומים | https://...">${esc(links.map(l=>`${l.t} | ${l.u}`).join("\n"))}</textarea>`,
    ()=>{ const v=$("#lk").value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(([t,u])=>t&&u&&/^https?:\/\//.test(u)).map(([t,u])=>({t,u}));
      saveConfig({links:v}); toast("נשמר ✓"); });
}
function openSettings(){
  openSheet("⚙️ הגדרות", `<label>השם שלי</label><input id="sn" value="${esc(myName())}">
    <label>קישור זום למפגשים היומיים</label><input id="z1" inputmode="url" value="${esc(cfg("zoomDaily")||"")}" placeholder="https://zoom.us/j/...">
    <label>קישור זום למפגש שישי</label><input id="z2" inputmode="url" value="${esc(cfg("zoomFriday")||"")}" placeholder="אם ריק – אותו קישור כמו היומי">
    <label>קישור לקהילת הצעירים</label><input id="z3" inputmode="url" value="${esc(cfg("zoomCommunity")||"")}">
    <label>קישור לשיעור הבוקר / חומרי לימוד</label><input id="z4" inputmode="url" value="${esc(cfg("lessonLink")||"")}">
    <label class="chk"><input type="checkbox" id="wa" ${waOn()?"checked":""}> לפתוח וואטסאפ עם 🦁 כשאני לוחץ "קמתי לשיעור"</label>
    <div style="height:14px"></div><button class="btn" id="qbtn">✦ ניהול קטעי מקובלים (${S.quotes.length||"דוגמאות"})</button>`,
    ()=>{ const n=$("#sn").value.trim(); if(n && n!==myName()) saveName(n); lsSet("asiria-wa", $("#wa").checked?"1":"0");
      const ok = u => !u || /^https?:\/\//.test(u);
      const z=[$("#z1").value.trim(),$("#z2").value.trim(),$("#z3").value.trim(),$("#z4").value.trim()];
      if (!z.every(ok)){ toast("קישור צריך להתחיל ב־https://"); return false; }
      saveConfig({zoomDaily:z[0], zoomFriday:z[1], zoomCommunity:z[2], lessonLink:z[3]}); toast("נשמר ✓"); });
  $("#qbtn").onclick=()=>openQuotes();
}
function openQuotes(){
  const list = S.quotes.slice().sort((a,b)=>(b.at||0)-(a.at||0));
  openSheet("✦ קטעי מקובלים", `<div class="note" style="text-align:start">בכל כניסה לאפליקציה מופיע קטע אקראי מהמאגר.${list.length?"":" כרגע מוצגים קטעים לדוגמה."}</div>
    <label>קטע חדש</label><textarea id="qt" placeholder="הטקסט"></textarea><label>מקור</label><input id="qs" placeholder="לדוגמה: בעל הסולם, מאמר הערבות">
    <div style="height:10px"></div><button class="btn gold" id="qa">+ הוספה למאגר</button><div style="height:16px"></div>
    ${list.map(q=>`<div class="qitem"><div>${esc(q.text)}${q.source?`<br><small style="color:var(--gold2)">— ${esc(q.source)}</small>`:""}</div><button data-del="${esc(q.id)}" style="color:var(--rose)">✕</button></div>`).join("")}`, null);
  $("#qa").onclick=async()=>{ const t=$("#qt").value.trim(); if(!t) return; const id="q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    S.quotes.push({id,text:t,source:$("#qs").value.trim(),at:Date.now()}); put("quotes/"+id,{text:t,source:$("#qs").value.trim(),at:Date.now(),by:myName()}); toast("נוסף למאגר ✦"); openQuotes(); };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const id=b.dataset.del; S.quotes=S.quotes.filter(q=>q.id!==id); remove("quotes/"+id); openQuotes(); });
}

window.addEventListener("hashchange",()=>{ const t=location.hash.replace("#",""); if(TABS.some(x=>x[0]===t)){ S.tab=t; renderNav(); render(); } });
init();
</script>
